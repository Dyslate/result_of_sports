<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scores du jour</title>
  <link rel="icon" href="icons/icon32.png" />
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="page.css" />
</head>
<body class="page">
  <div class="wrap">
    <header class="pg-head">
      <div class="pg-brand">
        <img src="icons/icon128.png" alt="" width="40" height="40" />
        <div>
          <h1 data-i18n="app.title">Scores du jour</h1>
          <div id="today-long" class="pg-date"></div>
        </div>
      </div>

      <div class="pg-daynav">
        <button id="day-prev" class="icon-btn" data-i18n-title="day.prev" data-i18n-aria="day.prev">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button id="day-label" class="day-label" data-i18n-title="day.backToday"></button>
        <button id="day-next" class="icon-btn" data-i18n-title="day.next" data-i18n-aria="day.next">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="pg-actions">
        <div class="lang-seg" role="radiogroup" data-i18n-aria="ui.language">
          <button data-lang="fr" role="radio" title="Français" aria-label="Français"></button>
          <button data-lang="en" role="radio" title="English" aria-label="English"></button>
        </div>
        <button id="theme-btn" class="icon-btn" data-i18n-aria="theme.button"></button>
        <button id="refresh" class="icon-btn" data-i18n-title="ui.refresh" data-i18n-aria="ui.refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <span id="updated" class="pg-updated"></span>
      </div>
    </header>

    <section id="kpis" class="kpis" aria-live="polite"></section>

    <div class="pg-grid">
      <section class="pg-col">
        <div class="col-head">
          <h2><span data-i18n="page.football">Football</span> <span id="foot-count" class="h-count"></span></h2>
          <div class="col-tools">
            <div class="search">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="search" type="search" data-i18n-placeholder="ui.search" data-i18n-aria="ui.searchAria" />
            </div>
            <button id="live-only" class="chip" aria-pressed="false" data-i18n-title="ui.liveTitle">
              <span class="chip-dot"></span><span data-i18n="ui.live">Direct</span>
            </button>
          </div>
        </div>
        <div id="foot" class="foot-masonry"></div>
      </section>

      <aside class="pg-col">
        <div class="col-head"><h2 data-i18n="page.motorsport">Sport auto</h2></div>
        <div class="sub-head"><span class="tag f1">F1</span></div>
        <div id="f1"></div>
        <div class="sub-head"><span class="tag gt">GT3</span></div>
        <div id="gt"></div>
      </aside>
    </div>

    <footer class="pg-foot">
      <p data-i18n="page.sources"></p>
      <p data-i18n="page.settingsHint"></p>
    </footer>
  </div>

  <!-- Standings dialog -->
  <dialog id="dlg-stand" class="dlg">
    <div class="dlg-head">
      <h2 id="stand-title"></h2>
      <button class="icon-btn dlg-close" data-i18n-aria="page.close">✕</button>
    </div>
    <div id="stand-body" class="dlg-body"></div>
  </dialog>

  <!-- Video dialog -->
  <dialog id="dlg-video" class="dlg dlg-video">
    <div class="dlg-head">
      <h2 id="video-title" data-i18n="vid.title"></h2>
      <button class="icon-btn dlg-close" data-i18n-aria="page.close">✕</button>
    </div>
    <div id="video-body" class="dlg-body"></div>
  </dialog>

  <script type="module" src="page.js"></script>
</body>
</html>
